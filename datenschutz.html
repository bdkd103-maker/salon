<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datenschutz | SALO</title>
  <style>
    :root { --bg: #11100e; --text: #f5efe7; --muted: #b8ab9d; --gold: #c79a5c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    .container { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    .eyebrow { color: var(--gold); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
    .back { color: var(--gold); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 24px; }
    .back:hover { text-decoration: underline; }
    .content { color: var(--muted); font-size: 16px; }
    .content h2 { color: var(--text); font-size: 20px; margin: 24px 0 8px; }
    .content p, .content div { margin: 0 0 12px; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="./">&larr; Zurück zur Startseite</a>
    <div class="eyebrow">Datenschutz</div>
    <h1>Datenschutzerklärung</h1>
    <div class="content" id="legal-content"><p class="empty">Lade Inhalte…</p></div>
  </div>
  <script>
    (async () => {
      const el = document.getElementById('legal-content');
      try {
        const base = location.port === '8000' ? location.protocol + '//' + location.hostname + ':4000' : location.origin;
        const res = await fetch(base + '/api/v1/legal');
        const data = await res.json();
        if (data.datenschutz) { el.innerHTML = data.datenschutz; } else { el.innerHTML = '<p class="empty">Keine Datenschutzerklärung hinterlegt.</p>'; }
      } catch { el.innerHTML = '<p class="empty">Inhalte konnten nicht geladen werden.</p>'; }
    })();
  </script>
</body>
</html>
